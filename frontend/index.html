<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Margo · Compras</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-view" class="login-screen">
  <form id="login-form" class="login-box">
    <div class="login-logo"><img src="assets/logo.png" alt="Margó Gourmet"></div>
    <h1>Compras</h1>
    <p class="subtitle">Inicia sesión con tu cuenta de la plataforma</p>
    <label>Email</label>
    <input type="email" id="login-email" required autocomplete="username">
    <label>Contraseña</label>
    <input type="password" id="login-password" required autocomplete="current-password">
    <button type="submit">Ingresar</button>
    <p id="login-error" class="error-msg"></p>
  </form>
</div>

<div id="app-view" class="app-shell" hidden>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/logo.png" alt="Margó Gourmet">
      <div class="tag">Compras</div>
    </div>
    <nav id="nav-list"></nav>
  </aside>
  <main class="content">
    <header class="topbar">
      <span id="user-info"></span>
      <button id="logout-btn">Cerrar sesión</button>
    </header>
    <section id="view-content"></section>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
