<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Margo · Compras</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-view" class="login-screen">
  <form id="login-form" class="login-box">
    <div class="login-logo"><img src="assets/logo.png" alt="Margó Gourmet"></div>
    <h1>Compras</h1>
    <p class="subtitle">Inicia sesión con tu cuenta de la plataforma</p>
    <label>Email</label>
    <input type="email" id="login-email" required autocomplete="username">
    <label>Contraseña</label>
    <input type="password" id="login-password" required autocomplete="current-password">
    <button type="submit">Ingresar</button>
    <p id="login-error" class="error-msg"></p>
  </form>
</div>

<div id="app-view" class="app-shell" hidden>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/logo.png" alt="Margó Gourmet">
      <div class="tag">Compras</div>
    </div>
    <nav id="nav-list"></nav>
  </aside>
  <main class="content">
    <header class="topbar">
      <span id="user-info"></span>
      <span>
        <button id="cambiar-password-btn" class="btn-link" style="margin-right:1rem">Cambiar contraseña</button>
        <button id="logout-btn">Cerrar sesión</button>
      </span>
    </header>
    <section id="view-content"></section>
  </main>
</div>

<div id="pw-modal" class="modal-overlay" hidden>
  <form id="pw-form" class="modal-box">
    <h3>Cambiar contraseña</h3>
    <p class="placeholder">Esta es tu contraseña de la plataforma — no tiene relación con tu cuenta de Odoo.</p>
    <label class="field-label">Contraseña actual</label>
    <input type="password" id="pw-actual" class="field" style="width:100%" required autocomplete="current-password">
    <label class="field-label" style="margin-top:.75rem">Contraseña nueva</label>
    <input type="password" id="pw-nueva" class="field" style="width:100%" required autocomplete="new-password" minlength="6">
    <label class="field-label" style="margin-top:.75rem">Repetir contraseña nueva</label>
    <input type="password" id="pw-repetir" class="field" style="width:100%" required autocomplete="new-password" minlength="6">
    <div style="margin-top:1.25rem">
      <button type="submit" class="btn btn-primary">Guardar</button>
      <button type="button" id="pw-cancel" class="btn">Cancelar</button>
    </div>
    <p id="pw-error" class="error-msg"></p>
  </form>
</div>

<div id="oc-modal" class="modal-overlay" hidden>
  <form id="oc-form" class="modal-box">
    <h3>Generar Orden de Compra en Odoo</h3>
    <p class="placeholder">Tus credenciales de Odoo se usan solo para esta acción y no se guardan en ningún lado.</p>
    <label class="field-label">Email Odoo</label>
    <input type="email" id="oc-email" class="field" style="width:100%" required autocomplete="off">
    <label class="field-label" style="margin-top:.75rem">Contraseña Odoo</label>
    <input type="password" id="oc-password" class="field" style="width:100%" required autocomplete="off">
    <div style="margin-top:1.25rem">
      <button type="submit" class="btn btn-primary">Crear OC</button>
      <button type="button" id="oc-cancel" class="btn">Cancelar</button>
    </div>
    <p id="oc-error" class="error-msg"></p>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
